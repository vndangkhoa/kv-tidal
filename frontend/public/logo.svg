<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00e5ff" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(80, 80) scale(0.42)" filter="url(#logoGlow)">
    <polygon points="0,-85 60,0 0,85 -60,0" fill="url(#logoBrandGrad)" />
    <polygon points="-75,-42 -35,0 -75,42 -115,0" fill="#00e5ff" opacity="0.95" />
    <polygon points="-135,-85 -95,-42 -135,0 -175,-42" fill="#00e5ff" opacity="0.8" />
    <polygon points="-135,0 -95,42 -135,85 -175,42" fill="#00e5ff" opacity="0.8" />
    <polygon points="75,-42 115,0 75,42 35,0" fill="#10b981" opacity="0.95" />
    <polygon points="135,-85 175,-42 135,0 95,-42" fill="#10b981" opacity="0.8" />
    <polygon points="135,0 175,42 135,85 95,42" fill="#10b981" opacity="0.8" />
    <polygon points="0,-145 35,-95 0,-45 -35,-95" fill="#33ebff" opacity="0.9" />
    <polygon points="0,45 35,95 0,145 -35,95" fill="#10b981" opacity="0.9" />
  </g>

  <!-- Text Branding -->
  <text x="165" y="92" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="4" fill="#f8fafc">
    KV-TIDAL
  </text>

  <!-- Lossless Pill Badge -->
  <g transform="translate(460, 62)">
    <rect width="105" height="30" rx="6" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="52.5" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="#00e5ff" text-anchor="middle">
      LOSSLESS
    </text>
  </g>
</svg>
